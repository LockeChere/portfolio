<div class="form-container">
  <h2>{{ 'auth.register' | translate }}</h2>
  <form [formGroup]="registerForm" (ngSubmit)="register()">
    <div class="form-group">
      <label>Email:</label>
      <input type="email" formControlName="email" required data-cy="register-email" />
      <!-- ... -->
    </div>

    <div class="form-group">
      <label>{{ 'auth.password' | translate }}:</label>
      <input type="password" formControlName="password" required data-cy="register-password" />
      <!-- ... -->
    </div>

    <div class="form-group">
      <label>{{ 'auth.password_confirm' | translate }}:</label>
      <input type="password" formControlName="password_confirmation" required data-cy="register-password-confirmation" />
      <!-- ... -->
    </div>

    <button type="submit" class="submit-btn" data-cy="register-submit">{{ 'auth.register' | translate }}</button>
  </form>

  <p>{{ 'auth.hasAccount' | translate }}<a routerLink="/login">{{ 'auth.login-link' | translate }}</a></p>
</div>
