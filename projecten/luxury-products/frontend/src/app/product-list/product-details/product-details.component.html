<div *ngIf="product; else loading" class="product-container">
  <div class="product-image">
    <img [src]="product.imageUrl" [alt]="product.name" />
  </div>

  <div class="product-info">
    <h1 class="product-title">{{ product.name }}</h1>
    <p class="product-description">{{ product.description }}</p>
    <p class="product-price">
      {{ 'product.price' | translate }}: €{{ totalPrice }}
    </p>
    <p class="product-stock" [ngClass]="{'low-stock': product.stock <= 5, 'out-of-stock': product.stock === 0}">
      {{ stockStatus }}
    </p>


    <button class="buy-button"
            (click)="addToCart()"
            [disabled]="product.stock === 0">
      {{ product.stock === 0 ? ('product.out-of-stock' | translate) : ('product.add' | translate) }}
    </button>
  </div>
</div>

<ng-template #loading>
  <p class="loading-text">{{ 'product.loading' | translate }}</p>
</ng-template>
