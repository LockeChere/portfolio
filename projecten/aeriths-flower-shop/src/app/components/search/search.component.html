<section class="form-header">
  <form (ngSubmit)="doSearch(myInput.value)">
    <label for="searchInput" class="sr-only">{{ 'Search for products ...' | translate }}</label>
    <input 
      #myInput
      id="searchInput"
      class="au-input au-input-xl"
      type="text"
      placeholder="Search for products ..."
    />
    <button type="submit" class="au-btn-submit">{{ 'Search' | translate }}</button>
  </form>
</section>
