<table class="table">
    <thead class="table-dark">
        <tr>
            <th></th>
            <th>Name</th>
            <th>Price</th>
            <th>Units in Stock</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let tempProduct of products">
            <td class="align-middle">
                <img [src]="tempProduct.imgUrl | productImg" height="50"/>
            </td>
            <td class="align-middle">{{ tempProduct.name}}</td>
            <td class="align-middle">{{ tempProduct.price | currency:'EUR'}}</td>
            <td class="align-middle">{{ tempProduct.unitsInStock }}</td>
        </tr>
    </tbody>
</table>
